name: Minify on Push
on:
  push:
    branches: [main]
    paths: ['index.js', 'build.mjs']

permissions:
  contents: write

jobs:
  minify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 直接在云端装依赖，不需要 package.json
      - run: npm install --no-save esbuild esbuild-minify-templates

      - run: node build.mjs

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: auto-minify [skip ci]"
            git push
          fi