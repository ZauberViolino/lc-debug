name: Minify on Push
on:
  push:
    branches: [main]
    paths: ['index.js', 'build.mjs', 'package.json']

permissions:
  contents: write

jobs:
  minify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 可选：确保 Node 版本一致。不写这一步，直接用预装的 Node 也可以。
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - run: npm ci
      
      # 这一步完全在云端运行，你本地不需要有 Node
      - run: node build.mjs
      
      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: auto-minify [skip ci]"
            git push
